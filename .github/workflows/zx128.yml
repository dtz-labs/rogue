name: ZX128 build and smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zx128-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  Z88DK_IMAGE: z88dk/z88dk:20251006@sha256:614d0e79ed3bcf56e935806872156b5cf11b2f70843edd18b2bc2a7de9905a79
  ZESARUX_VERSION: "13.0"
  ZESARUX_URL: https://github.com/chernandezba/zesarux/releases/download/ZEsarUX-13.0/ZEsarUX_linux-13.0-ubuntu24_x86_64.tar.gz
  ZESARUX_SHA256: 596388df21388fd6c485dab23f7d157ef5b1753f872e63ed77574c9e8c642d55
  JSSPECCY_VERSION: "3.2"
  JSSPECCY_URL: https://github.com/gasman/jsspeccy3/releases/download/v3.2/jsspeccy-3.2.zip
  JSSPECCY_SHA256: 5434b5565da96a05089491f722c8fbcd8b3b70ab0277746309d2ee1db1fdbcb9

jobs:
  build:
    name: Build and check layout
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Build TAP and check banked objects with pinned z88dk
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/src" \
            "$Z88DK_IMAGE" \
            make -C zx128 check-banked-objects JOBS=2

      - name: Check fixed and banked memory layout
        run: |
          python3 zx128/tools/check_layout.py \
            --map zx128/build/rogue-zx128.map \
            --main-bin zx128/build/rogue-zx128.bin \
            --stack-reserve 3072 \
            --heap-reserve 3072

      - name: Check cross-bank calls page correctly
        run: |
          python3 zx128/tools/check_bank_calls.py \
            --map zx128/build/rogue-zx128.map \
            --root .

      - name: Stamp the version on a distributable copy
        run: |
          make -C zx128 --no-print-directory dist
          ls -l "zx128/build/$(make -C zx128 --no-print-directory print-dist-tap)"

      - name: Upload TAP and linker outputs
        uses: actions/upload-artifact@v7
        with:
          name: zx128-build
          path: |
            zx128/build/rogue-zx128.tap
            zx128/build/rogue-zx128-*.tap
            zx128/build/rogue-zx128.map
            zx128/build/rogue-zx128.bin
            zx128/build/rogue-zx128_BANK_*.bin
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: ZEsarUX smoke
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Download ZX128 build
        uses: actions/download-artifact@v8
        with:
          name: zx128-build
          path: zx128/build

      - name: Install ZEsarUX runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libasound2t64 \
            libncurses6 \
            libpulse0 \
            libsdl1.2debian \
            libsndfile1 \
            libssl3t64 \
            libtinfo6 \
            libx11-6 \
            libxext6

      - name: Download pinned ZEsarUX
        id: zesarux
        run: |
          archive="$RUNNER_TEMP/zesarux-$ZESARUX_VERSION.tar.gz"
          emulator_root="$RUNNER_TEMP/zesarux"
          emulator_dir="$emulator_root/ZEsarUX-$ZESARUX_VERSION"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$archive" "$ZESARUX_URL"
          echo "$ZESARUX_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$emulator_root"
          tar -xzf "$archive" -C "$emulator_root"
          ldd "$emulator_dir/zesarux"
          echo "directory=$emulator_dir" >> "$GITHUB_OUTPUT"
          echo "binary=$emulator_dir/zesarux" >> "$GITHUB_OUTPUT"

      - name: Boot and test in ZEsarUX
        run: |
          cd "${{ steps.zesarux.outputs.directory }}"
          python3 -u "$GITHUB_WORKSPACE/zx128/tools/zesarux_smoke.py" \
            --zesarux "${{ steps.zesarux.outputs.binary }}" \
            --tap "$GITHUB_WORKSPACE/zx128/build/rogue-zx128.tap" \
            --map "$GITHUB_WORKSPACE/zx128/build/rogue-zx128.map" \
            --screenshot "$GITHUB_WORKSPACE/zx128/build/rogue-zx128-smoke.pbm"

      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zx128-smoke
          path: zx128/build/rogue-zx128-smoke.pbm
          if-no-files-found: ignore
          retention-days: 14

  pages:
    name: Deploy browser player
    needs: [build, smoke]
    if: >-
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'push') &&
      (github.ref == 'refs/heads/codex/zx128-port' ||
       github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7

      - name: Download tested ZX128 build
        uses: actions/download-artifact@v8
        with:
          name: zx128-build
          path: zx128/build

      - name: Download pinned JSSpeccy release
        run: |
          archive="$RUNNER_TEMP/jsspeccy-$JSSPECCY_VERSION.zip"
          emulator_root="$RUNNER_TEMP/jsspeccy-$JSSPECCY_VERSION"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$archive" "$JSSPECCY_URL"
          echo "$JSSPECCY_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$emulator_root"
          unzip -q "$archive" -d "$emulator_root"

      - name: Name the distributable TAP
        run: |
          echo "ZX128_TAP=$(make -C zx128 --no-print-directory print-dist-tap)" \
            >> "$GITHUB_ENV"

      - name: Assemble Pages site and licence notices
        run: |
          emulator_root="$RUNNER_TEMP/jsspeccy-$JSSPECCY_VERSION"
          mkdir -p _site
          cp -R zx128/site/. _site/
          cp -R "$emulator_root/jsspeccy" _site/jsspeccy
          # Serve the version in the filename so a downloaded TAP identifies
          # itself, and keep the plain name as a copy so the links already
          # published in the READMEs keep resolving after every release.
          cp zx128/build/rogue-zx128.tap "_site/$ZX128_TAP"
          cp zx128/build/rogue-zx128.tap _site/rogue-zx128.tap
          sed -E -i "s/rogue-zx128(-[0-9][0-9.]*)?\.tap/$ZX128_TAP/g" \
            _site/index.html _site/app.js
          cp LICENSE.TXT _site/LICENSE-ROGUE.txt
          cp "$emulator_root/COPYING" _site/COPYING-JSSPECCY3.txt
          cp "$emulator_root/README.md" _site/README-JSSPECCY3.md
          find _site/jsspeccy -name .DS_Store -delete
          printf '%s\n' \
            "JSSpeccy 3.2 corresponding source:" \
            "https://github.com/gasman/jsspeccy3/tree/1f761ca2c17b6a6fdf1b7616e091a2b49b45a49f" \
            > _site/SOURCE-JSSPECCY3.txt

      - name: Validate Pages artifact
        run: |
          test -s _site/index.html
          test -s "_site/$ZX128_TAP"
          test -s _site/rogue-zx128.tap
          grep -q "$ZX128_TAP" _site/index.html
          grep -q "$ZX128_TAP" _site/app.js
          test -s _site/jsspeccy/jsspeccy.js
          test -s _site/jsspeccy/jsspeccy-worker.js
          test -s _site/jsspeccy/jsspeccy-core.wasm
          test -s _site/jsspeccy/jsspeccy.js.LICENSE.txt
          test -s _site/jsspeccy/roms/128-0.rom
          test -s _site/jsspeccy/roms/128-1.rom
          test -s _site/jsspeccy/tapeloaders/tape_128.szx
          test -s _site/LICENSE-ROGUE.txt
          test -s _site/COPYING-JSSPECCY3.txt
          test -s _site/README-JSSPECCY3.md
          test -s _site/SOURCE-JSSPECCY3.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
